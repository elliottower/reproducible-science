version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      # Do not propose a release in its first week: that is the window in which a compromised
      # version is most likely to still be live.
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      # Do not propose a release in its first week: that is the window in which a compromised
      # version is most likely to still be live.
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
    commit-message:
      prefix: deps
