name: Code scanning

# This repository's own declared claims, as code scanning alerts. `repro export sarif` writes
# one result for each assertion in `repro.yaml` that does not hold, and the upload shows it
# under Security and, where its line is in the diff, on the pull request. It exits 0 whatever
# it finds: the pre-commit hook and `claims verify` are the checks that fail.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    name: declared claims (SARIF)
    runs-on: ubuntu-latest
    # A pull request from a fork gets a read-only token, and the upload would fail there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --all-packages --group dev
      - run: uv run repro export sarif -o repro.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: repro.sarif
          category: repro
