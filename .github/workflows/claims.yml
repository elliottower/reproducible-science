name: claims

# The workflow `repro ci init` writes for a project, run on this repository's own `repro.yaml`.
# Named for the check and not for the project: the badge prints this name beside `passing`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  claims:
    name: this repository's own declared claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      # A project installs the released package with `uvx`. This runs the checkout, so a change
      # to the check is tried on these claims before it is released.
      - run: uv sync --all-packages --group dev
      - run: uv run repro ci claims
