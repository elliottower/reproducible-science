# Releases are per package. The tag names which one, so publishing citations never ships a
# preregistration tool. Trusted publishing on PyPI is bound to this repository AND this
# workflow filename: a package moved here needs its publisher reconfigured before the first
# release, or the upload is rejected.
name: Publish reproducible-science

on:
  push:
    tags: ["repro-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/repro
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          # No cache on a release run: a poisoned cache entry would be baked into a wheel
          # that then gets signed and published.
          enable-cache: false
      - run: uv sync --all-packages
        working-directory: .
      - run: uv run pytest
        working-directory: .
      - run: uv build --package reproducible-science --out-dir dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: packages/repro/dist
