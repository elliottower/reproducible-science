name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: lint, format, manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv lock --check

  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-packages --group dev --python ${{ matrix.python }}
      - run: uv run pytest -q

  scientific-integrity:
    # The jobs above check the code. This one checks the claims: that the manuscript's numbers
    # still match their artifacts, and that every committed derived file is what its generator
    # produces. The second is here because a generator once dropped a section in silence while
    # the tests stayed green.
    name: evidence and derived artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-packages --group dev
      - run: uv run repro verify paper/repro.yaml --policy strict
      - run: uv run python scripts/check_drift.py
      - run: uv run python scripts/check_pins.py
      - run: uv run pytest -q -m corpus

  packaging:
    # The workspace resolves the four packages from source, so `pytest` never exercises the
    # combination a user installs.
    name: dependencies and wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-packages --group dev --group audit
      - run: uv run python scripts/check_deps.py
      - run: uv run python scripts/check_wheels.py
      - run: uv run vulture

  interop:
    # adduce is an optional extra on its own release schedule, so this resolves it fresh rather
    # than from the lockfile. An upstream change that moves the surface the rule depends on
    # would otherwise disable the rule quietly: the entry point still loads and nothing is
    # ever reported.
    name: third-party interop (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-packages --group dev
      # Advisory here and blocking in `make release-check`: a new adduce release should not
      # redden an unrelated pull request, and should not ship silently either.
      - run: make interop

  publishable:
    name: publishable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # A workspace path resolves a sibling in development and does not survive into a wheel.
      - run: make publishable

  versions:
    name: lockstep versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-packages --group dev
      - run: make versions

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-packages --group dev
      # `make coverage` sets the three variables that make a subprocess measurable. Most of
      # these suites drive a CLI the way a user does, and without them the CLI modules report
      # near zero while their tests pass.
      - run: make coverage

      # Codecov reports the coverage change on each pull request, which the --fail-under
      # floor in `make coverage` cannot do. An upload failure is not a build failure: the
      # floor is enforced above, and a third party being down should not redden this repo.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lowest-direct:
    name: lowest declared versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # The workspace always installs the newest thing available, so a floor that is too low
      # is invisible here and fails for the first user who resolves differently. This target
      # existed and ran nowhere.
      - run: make check-lowest

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-packages --group dev --group types
      - run: uv run pyrefly check packages/repro/src packages/citations/src packages/results/src packages/prereg/src
