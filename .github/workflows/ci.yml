name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: lint, format, manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv lock --check

  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv sync --all-packages --group dev --python ${{ matrix.python }}
      - run: uv run pytest -q

  scientific-integrity:
    # The jobs above check the code. This one checks the claims: that the manuscript's numbers
    # still match their artifacts, and that every committed derived file is what its generator
    # produces. The second is here because a generator once dropped a section in silence while
    # the tests stayed green.
    name: evidence and derived artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv sync --all-packages --group dev
      - run: uv run repro verify paper/repro.yaml --policy strict
      - run: uv run python scripts/check_drift.py
      - run: uv run python scripts/check_pins.py
      - run: uv run pytest -q -m corpus

  packaging:
    # The workspace resolves the four packages from source, so `pytest` never exercises the
    # combination a user installs.
    name: dependencies and wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv sync --all-packages --group dev --group audit
      - run: uv run python scripts/check_deps.py
      - run: uv run python scripts/check_wheels.py
      - run: uv run vulture

  interop:
    # adduce is an optional extra on its own release schedule, so this resolves it fresh rather
    # than from the lockfile. An upstream change that moves the surface the rule depends on
    # would otherwise disable the rule quietly: the entry point still loads and nothing is
    # ever reported.
    name: third-party interop (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv sync --all-packages --group dev --upgrade-package adduce
      - run: uv run pytest -q -m integration

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv sync --all-packages --group dev --group types
      - run: uv run pyrefly check packages/repro/src packages/citations/src packages/results/src packages/prereg/src
