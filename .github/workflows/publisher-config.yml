name: Publisher config

# What a weekly run can still check, now that the `release` environment admits version tags only.
#
# The binding job in each publish workflow mints a real OIDC token and asks PyPI whether it would
# accept an upload. That is the stronger check and it still exists -- but it needs the `release`
# environment, and the environment refuses the default branch, so it cannot run on a schedule.
# Running it means naming a tag: `gh workflow run publish-citations.yml --ref v0.4.2`.
#
# This checks the half that drifts without anyone noticing: the workflow filename and environment
# that PyPI's trusted publisher is bound to. Renaming a workflow file breaks a release and nothing
# in a checkout says so. It cannot see PyPI's side, so it proves the repository still declares what
# the publisher expects -- not that the publisher still expects it.

on:
  schedule:
    - cron: "7 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/publish-*.yml"
      - ".github/workflows/publisher-config.yml"
      - "scripts/check_publishers.py"

permissions:
  contents: read

jobs:
  declared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false

      # The filename-to-project mapping lives in `scripts/check_publishers.py`, one copy for
      # this check and the binding report both. A rename on either side breaks a release, so the
      # mapping is written down rather than inferred, and a publish workflow it does not name
      # fails here. Every job with `id-token: write` must run in `release`: a release workflow
      # may build in a job of its own with no token, as `publish-ui.yml` does around npm.
      - name: every job that can mint an upload token runs in the release environment
        run: uv run --no-project --with pyyaml==6.0.2 python scripts/check_publishers.py --declared
