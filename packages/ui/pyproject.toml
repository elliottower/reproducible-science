[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "reproducible-science-ui"
version = "0.6.1"
description = "A local web page over a project's Reproducible Science records: claims, files, runs, quotations and re-runs"
readme = "README.md"
keywords = [ "lineage", "provenance", "reproducibility", "ui" ]
license = "MIT"
authors = [ { name = "Elliot Tower", email = "elliot@elliottower.ai" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pyyaml>=6.0.2",
  # Run, never imported: the page is built from what `repro`, `prereg` and `results` print.
  "reproducible-science>=0.6,<0.7",
]
urls.Changelog = "https://github.com/elliottower/reproducible-science/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/elliottower/reproducible-science"
urls.Issues = "https://github.com/elliottower/reproducible-science/issues"
urls.Source = "https://github.com/elliottower/reproducible-science/tree/main/packages/ui"
scripts.repro-ui = "repro_ui.server:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/repro_ui" ]
# The built page is not in git (web/ is its source); listed so a build that made it ships it.
build.targets.wheel.artifacts = [ "src/repro_ui/static/**" ]
build.targets.sdist.artifacts = [ "src/repro_ui/static/**" ]
build.targets.sdist.exclude = [ "web/node_modules" ]
# Builds the page with npm before a wheel or an sdist is made, unless it is already built.
build.hooks.custom.path = "hatch_build.py"

[tool.uv]
sources.reproducible-science = { workspace = true }

[tool.deptry]
# Run as a subprocess and imported nowhere, as `results-cli` is in `reproducible-science`.
per_rule_ignores.DEP002 = [ "reproducible-science" ]
known_first_party = [ "repro_ui" ]
extend_exclude = [ "web", "hatch_build.py" ]
