[project]
name = "prereg"
version = "0.2.0"
description = "Freeze a plan before you run it, and record what changed after"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elliot Tower", email = "elliot@elliottower.ai" }]
keywords = ["preregistration", "reproducibility", "open science", "osf"]
dependencies = []  # stdlib only

[project.scripts]
prereg = "prereg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prereg"]

[tool.deptry]
# Without this every intra-package import reads as a transitive dependency on itself.
known_first_party = ["prereg"]
