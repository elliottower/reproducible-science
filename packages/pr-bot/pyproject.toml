[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "reproducible-science-pr-bot"
version = "0.6.1"
description = "A pull-request bot that comments on each claim in repro.yaml that fails or went stale, and records the answers"
readme = "README.md"
keywords = [ "github-actions", "manuscript", "pull-request", "reproducibility" ]
license = "MIT"
authors = [ { name = "Elliot Tower", email = "elliot@elliottower.ai" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # What fails is decided by the checker, and a set_aside entry is a manifest model.
  "claims-cli>=0.6,<0.7",
  "provenance-core>=0.6,<0.7",
  # Floors, not bare names: without them a fresh install resolves whatever is oldest on
  # PyPI, which is not the combination the tests exercise.
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
]
urls.Changelog = "https://github.com/elliottower/reproducible-science/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/elliottower/reproducible-science"
urls.Issues = "https://github.com/elliottower/reproducible-science/issues"
urls.Source = "https://github.com/elliottower/reproducible-science/tree/main/packages/pr-bot"
scripts.reproducible-science-pr-bot = "repro_pr_bot.cli:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/repro_pr_bot" ]

[tool.uv]
# Resolved from the workspace during development and from PyPI once published.
sources.claims-cli = { workspace = true }
sources.provenance-core = { workspace = true }

[tool.ruff]
lint.isort.known-first-party = [ "repro_pr_bot" ]

[tool.deptry]
known_first_party = [ "repro_pr_bot" ]
