[project]
name = "results-cli"
version = "0.3.0"
description = "Seal a run, record what it produced, and verify the chain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elliot Tower", email = "elliot@elliottower.ai" }]
keywords = ["reproducibility", "provenance", "open science", "results"]
dependencies = []

[project.scripts]
results = "results.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/results"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.deptry]
# Without this every intra-package import reads as a transitive dependency on itself.
known_first_party = ["results"]
