[project]
name = "citations"
version = "0.2.0"
description = "A library of quotations checked against the sources they came from"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elliot Tower", email = "elliot@elliottower.ai" }]
keywords = ["citations", "bibliography", "provenance", "reproducibility", "bibtex"]
dependencies = ["PyYAML>=6.0", "platformdirs>=3.0", "pydantic>=2.0"]

[project.optional-dependencies]
lint = ["papis>=0.15"]

[project.scripts]
citations = "citations.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citations"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.deptry.per_rule_ignores]
# invoked as a subprocess by `citations lint`, so no import graph can see it. Named
# here rather than silenced globally: a genuinely unused dependency should still be reported.
DEP002 = ["papis"]

[tool.deptry]
# Without this every intra-package import reads as a transitive dependency on itself.
known_first_party = ["citations"]
