[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "reproducible-science"
version = "0.5.0"
description = "One contract for verifying declared evidence assertions against pinned artifacts"
readme = "README.md"
keywords = [ "citations", "open science", "preregistration", "provenance", "reproducibility" ]
license = "MIT"
authors = [ { name = "Elliot Tower", email = "elliot@elliottower.ai" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "citations>=0.5,<0.6",
  # Floors, not bare names: without them a fresh install resolves whatever is oldest on
  # PyPI, which is not the combination the tests exercise.
  "prereg>=0.5,<0.6",
  "provenance-core>=0.5,<0.6",
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "results-cli>=0.5,<0.6",
]
# Only needed to run the rule inside `adduce check`. repro itself never imports adduce.
optional-dependencies.adduce = [ "adduce>=0.1.2" ]
optional-dependencies.arrays = [
  "numpy>=2.2.6",
]
# Readers for the formats results arrive in besides delimited text and JSON. Each is optional,
# because most manifests address a CSV or a JSON file and a Parquet or HDF5 library is not
# something every install should carry. Without one, a check of that format is `unchecked` and
# names the extra; it never fails. All are MIT, BSD or Apache-2.0. Not `pyreadr`, which is AGPL
# and would relicense this package; `rdata` parses `.rds` in Python and starts no R process.
optional-dependencies.hdf5 = [ "h5py>=3.12" ]
optional-dependencies.netcdf = [ "netcdf4>=1.7.2" ]
optional-dependencies.parquet = [ "pyarrow>=18" ]
optional-dependencies.rds = [ "rdata>=1" ]
optional-dependencies.sheets = [ "openpyxl>=3.1", "xlrd>=2.0.1" ]
optional-dependencies.stata-spss = [ "pyreadstat>=1.3.6" ]
urls.Changelog = "https://github.com/elliottower/reproducible-science/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/elliottower/reproducible-science"
urls.Issues = "https://github.com/elliottower/reproducible-science/issues"
urls.Source = "https://github.com/elliottower/reproducible-science/tree/main/packages/repro"
scripts.repro = "repro.cli:main"
# adduce discovers this at check time; declaring it costs nothing when adduce is absent.
entry-points."adduce.rules".repro = "repro.integrations.adduce"

[dependency-groups]
dev = [
  "adduce>=0.1.2",
  "numpy>=2.2.6",
  "pytest>=9.1.1",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/repro" ]

[tool.uv]
# Resolved from the workspace during development and from PyPI once published, so a
# cross-package change is one commit rather than a release dance.
sources.citations = { workspace = true }
sources.prereg = { workspace = true }
sources.results-cli = { workspace = true }

[tool.deptry]
# invoked as subprocesses by `repro init`, so no import graph can see it. Named
# here rather than silenced globally: a genuinely unused dependency should still be reported.
per_rule_ignores.DEP002 = [ "prereg", "results-cli" ]
# Without this every intra-package import reads as a transitive dependency on itself.
known_first_party = [ "repro" ]
# The Claude Code plugin is not part of this distribution -- it ships through a marketplace,
# not the wheel, and `citations-0.2.0-py3-none-any.whl` carries no plugin file. Its hooks are
# standalone scripts that import a sibling package inside `try/except ImportError` and carry
# a fallback for when it is absent, which is the opposite of an undeclared dependency.
# `examples/` ships in neither: its scripts import each other by module name because they sit
# in one directory and are run from it, which reads as an undeclared dependency of a wheel
# that does not contain them.
extend_exclude = [ "examples", "plugin" ]

[tool.pytest]
ini_options.addopts = "-m 'not corpus'"
ini_options.markers = [
  "corpus: reads repositories outside this one, and may fetch them",
  "integration: exercises a third-party library that is not a runtime dependency",
]
