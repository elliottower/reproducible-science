[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reproducible-science"
version = "0.1.0"
description = "Scaffold reproducible science workflows — prereg, citations, and results in one command"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Elliot Tower", email = "elliot@elliottower.ai" }]
keywords = ["reproducibility", "preregistration", "citations", "provenance", "open science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "prereg",
    "citations",
    "results-cli",
]

[project.scripts]
repro = "repro.cli:main"

[project.urls]
Homepage = "https://github.com/elliottower/reproducible-science"

[tool.hatch.build.targets.wheel]
packages = ["src/repro"]
