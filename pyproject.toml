# Workspace root. Holds no package: the distributions live under `packages/`, each with its
# own pyproject, tests and public API, so `pip install citations` never drags in a
# preregistration tool. What is centralized here is the lockfile, the development
# environment, and the tooling configuration.

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "repro-science"
version = "0.1.0"
description = "The reproducible-science suite: repro, citations, results, and prereg"
readme = "README.md"
license = "MIT"
authors = [ { name = "Elliot Tower", email = "elliot@elliottower.ai" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "citations>=0.2",
  "prereg>=0.2",
  "reproducible-science>=0.3",
  "results-cli>=0.3",
]
urls.Homepage = "https://github.com/elliottower/reproducible-science"

[dependency-groups]
# Fast enough to run on every commit.
dev = [
  "adduce>=0.1.2",
  "coverage>=7.6",
  "numpy>=2.2.6",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-randomly>=3.15",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
  "ruff>=0.14",
]
# The deep pass: slow, or noisy enough that it advises rather than blocks.
audit = [
  "check-wheel-contents>=0.6",
  "complexipy>=2",
  "deptry>=0.20",
  "griffe>=1.5",
  "hypothesis>=6.100",
  "import-linter>=2.13",
  "pip-audit>=2.7",
  "towncrier>=25.8",
  "twine>=5",
  "vulture>=2.14",
]
# Type checking. Separate because adopting it is a ratchet, not a switch.
types = [ "pyrefly>=1" ]

[tool.hatch]
# Metadata only: the code lives in the four packages this depends on.
build.targets.wheel.bypass-selection = true

[tool.uv]
sources.citations = { workspace = true }
sources.prereg = { workspace = true }
sources.provenance-core = { workspace = true }
sources.reproducible-science = { workspace = true }
sources.results-cli = { workspace = true }
workspace.members = [ "packages/*" ]

[tool.ruff]
target-version = "py311"
line-length = 100
# `site/` is a JavaScript project: nothing under it is ruff's to police, and a stray file
# there must not be able to fail the Python gate.
extend-exclude = [ "packages/*/tests/conformance/cases", "site" ]
format.docstring-code-format = false
lint.select = [ "B", "C4", "E", "F", "I", "RUF", "UP", "W" ]
lint.ignore = [
  "E501",   # line length is enforced by the formatter, which knows when it cannot wrap
  "RUF001", # the prose uses en dashes and typographic quotes deliberately
  "RUF002",
  "RUF003",
]
lint.per-file-ignores."packages/*/tests/*" = [ "B011" ] # bare assert False is fine in a test

[tool.codespell]
# `unparseable` is the spelling used throughout, and the rest are author surnames in the
# sampling frame. Listed rather than skipping whole files, which would hide real typos.
ignore-words-list = "unparseable,ue,copie,buis,smae,nd,ist,fo"
skip = "uv.lock,experiments/*/frame.json,paper/prior_art/*,.git"

[tool.pytest]
ini_options.testpaths = [ "packages" ]
ini_options.consider_namespace_packages = true
# importlib import mode: three packages each have tests/test_cli.py, and the default mode
# derives a module name from the path relative to rootdir, so they collide. This is the fix
# that does not require scattering __init__.py through the test trees.
ini_options.addopts = "-m 'not corpus' --import-mode=importlib"
ini_options.markers = [
  "corpus: reads repositories outside this one, and may fetch them",
  "integration: exercises a third-party library that is not a runtime dependency",
]

[tool.coverage]
# Package names, not paths: a CLI test runs the command in a temporary directory, and a
# relative source path matches nothing from there -- so every CLI reported 0% while its
# tests passed.
run.source_pkgs = [ "citations", "prereg", "repro", "results" ]
run.omit = [ "*/tests/*" ]
run.branch = true
run.parallel = true
run.sigterm = true
report.exclude_also = [
  "\\.\\.\\.",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# One changelog for the workspace, because the packages release in lockstep: every package
# carries the same version and ships the same day, so four files would repeat one release
# four times. Entries are scoped with a `[package]` prefix instead, following dagster.
# A fragment is named for its pull request and its kind: changes/128.fixed.md

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
title_format = "## {version} — {project_date}"
issue_format = "[#{issue}](https://github.com/elliottower/reproducible-science/pull/{issue})"
type = [
  { directory = "added", name = "Added", showcontent = true },
  { directory = "changed", name = "Changed", showcontent = true },
  { directory = "fixed", name = "Fixed", showcontent = true },
  { directory = "removed", name = "Removed", showcontent = true },
  { directory = "deprecated", name = "Deprecated", showcontent = true },
]

# Architecture, enforced. The rule the monorepo exists to keep is that the three tools stay
# usable without the verifier: `pip install citations` must not drag in an evidence engine.

[tool.pyrefly]
# Invoked with explicit paths (see the Makefile): the default excludes site-packages, and an
# editable workspace install maps these same directories into it.
project_includes = [
  "packages/citations/src",
  "packages/prereg/src",
  "packages/repro/src",
  "packages/results/src",
]

[tool.vulture]
paths = [ "packages", "scripts" ]
min_confidence = 100

[tool.importlinter]
root_packages = [ "repro", "citations", "results", "prereg", "provenance_core" ]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "The shared primitives depend on nothing of ours"
type = "forbidden"
source_modules = [ "provenance_core" ]
forbidden_modules = [ "repro", "citations", "results", "prereg" ]

[[tool.importlinter.contracts]]
name = "The three tools do not depend on the verifier"
type = "forbidden"
source_modules = [ "citations", "results", "prereg" ]
forbidden_modules = [ "repro" ]

[[tool.importlinter.contracts]]
name = "The verifier's core does not import its integrations"
type = "forbidden"
source_modules = [
  "repro.core",
  "repro.models",
  "repro.adapters",
  "repro.resolve",
  "repro.verify",
  "repro.policy",
  "repro.regenerate",
]
forbidden_modules = [ "repro.integrations" ]

[[tool.importlinter.contracts]]
name = "The verifier is layered"
type = "layers"
layers = [
  "repro.cli",
  "repro.renderers.sarif",
  "repro.policy",
  "repro.verify",
  "repro.resolve",
  "repro.adapters",
  "repro.models",
  "repro.core",
  "repro.exceptions",
]
