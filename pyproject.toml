[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reproducible-science"
version = "0.3.0"
description = "One contract for verifying declared evidence assertions against pinned artifacts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Elliot Tower", email = "elliot@elliottower.ai" }]
keywords = ["reproducibility", "preregistration", "citations", "provenance", "open science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "prereg",
    "citations",
    "results-cli",
]

[project.scripts]
repro = "repro.cli:main"

[project.urls]
Homepage = "https://github.com/elliottower/reproducible-science"

[tool.hatch.build.targets.wheel]
packages = ["src/repro"]

[tool.pytest.ini_options]
markers = [
    "corpus: reads repositories outside this one, and may fetch them",
]
addopts = "-m 'not corpus'"

[project.optional-dependencies]
# Only needed to run the rule inside `adduce check`. repro itself never imports adduce.
adduce = ["adduce>=0.1.2"]
arrays = [
    "numpy>=2.2.6",
]

# adduce discovers this at check time; declaring it costs nothing when adduce is absent.
[project.entry-points."adduce.rules"]
repro = "repro.integrations.adduce"

[dependency-groups]
dev = [
    "adduce>=0.1.2",
    "numpy>=2.2.6",
    "pytest>=9.1.1",
]
