# Three tiers. Commit hooks stay under about ten seconds; anything slower runs on push or in
# CI, because a commit that takes three minutes is a commit people bypass.
#
#     uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#
# `prek` is a faster drop-in and reads this same file if you prefer it.

default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

# Conformance fixtures are pinned by digest: their exact bytes are the fixture. A hook that
# appends a trailing newline breaks every pin in the corpus, which is not hypothetical -- it
# happened the first time these hooks ran here.
exclude: |
  (?x)^(
    packages/repro/tests/conformance/cases/.*|
    packages/repro/examples/.*|
    uv\.lock
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict     # macOS hides case-only collisions that break on Linux
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: forbid-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # check before format: a lint fix can leave code the formatter still wants to rewrap.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.28.0
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--config, .markdownlint-cli2.yaml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        files: ^(pyproject\.toml|packages/[^/]+/pyproject\.toml)$

  - repo: local
    hooks:
      - id: uv-lock-current
        name: uv.lock matches the manifests
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|packages/[^/]+/pyproject\.toml|uv\.lock)$

      # `Co-Authored-By` is GitHub's credit convention and the wrong claim for a model;
      # deleting the line instead would hide that a commit had assistance. Rewritten, not
      # removed. Human co-authors are untouched.
      - id: commit-attribution
        name: AI co-authorship becomes disclosure
        entry: uv run python scripts/commit_msg_attribution.py
        language: system
        stages: [commit-msg]

      # The repository's own product, applied to itself. Runs only when the manuscript or the
      # engine changes, which is when a number can go stale.
      - id: repro-verify
        name: declared evidence assertions verify
        entry: uv run repro verify paper/repro.yaml --policy strict
        language: system
        pass_filenames: false
        files: ^(paper/|packages/repro/src/)

      # ---- pre-push: slower, repository-wide -------------------------------------------
      - id: pytest
        name: the whole workspace's tests
        entry: uv run pytest -q -x
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: drift
        name: committed derived artifacts reproduce
        entry: uv run python scripts/check_drift.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: vulture
        name: dead code
        entry: uv run vulture
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: deptry
        name: declared dependencies match imports
        entry: uv run python scripts/check_deps.py
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: import-linter
        name: package dependency direction
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]
